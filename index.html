<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aurora | AI Voice Assistant Debug</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body {
            background: radial-gradient(circle at 50% 20%, #1a102f 0%, #080511 100%);
            color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between; padding: 16px;
        }
        header { width: 100%; max-width: 820px; display: flex; justify-content: space-between; align-items: center; }
        .brand-container { display: flex; align-items: center; gap: 12px; }
        .logo-avatar { width: 36px; height: 36px; border-radius: 10px; background: #a855f7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .brand-title { font-size: 1.05rem; font-weight: 600; color: #fff; }
        .status-badge { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; color: #9ca3af; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #6b7280; }
        .status-badge.listening .status-dot { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-badge.thinking .status-dot { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .status-badge.speaking .status-dot { background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

        .main-card { width: 100%; max-width: 820px; flex: 1; min-height: 250px; max-height: 45vh; background: rgba(18, 14, 29, 0.55); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; display: flex; flex-direction: column; margin: 12px 0; overflow: hidden; position: relative; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .message-bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user-bubble { align-self: flex-end; background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; }
        .ai-bubble { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); color: #f3f4f6; }

        /* On-Screen Debugger */
        .debug-card { width: 100%; max-width: 820px; height: 120px; background: rgba(0, 0, 0, 0.7); border: 1px solid #a855f7; border-radius: 12px; padding: 10px; font-family: monospace; font-size: 0.75rem; color: #38bdf8; overflow-y: auto; margin-bottom: 12px; }
        .debug-title { color: #a855f7; font-weight: bold; margin-bottom: 4px; }

        .controls-container { width: 100%; max-width: 820px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .text-input-form { width: 100%; display: flex; gap: 8px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 4px 6px 4px 16px; }
        .text-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; }
        .send-btn { background: #a855f7; border: none; color: white; padding: 8px 16px; border-radius: 18px; cursor: pointer; }
        .voice-controls { display: flex; align-items: center; gap: 20px; }
        .mic-button { width: 68px; height: 68px; border-radius: 50%; border: none; outline: none; cursor: pointer; background: linear-gradient(135deg, #38bdf8, #a855f7); color: white; display: flex; align-items: center; justify-content: center; }
        .mic-button.active { background: linear-gradient(135deg, #ef4444, #a855f7); }
        .mic-icon { width: 26px; height: 26px; fill: currentColor; }
        .reset-btn { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: #9ca3af; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-avatar">A</div>
            <span class="brand-title">Aurora Assistant</span>
        </div>
        <div id="statusBadge" class="status-badge">
            <div class="status-dot"></div>
            <span id="statusText">Idle</span>
        </div>
    </header>

    <main class="main-card">
        <div id="chatBox" class="chat-box"></div>
    </main>

    <!-- ON-SCREEN DEBUGGER LOG -->
    <div class="debug-card">
        <div class="debug-title">System Status Log:</div>
        <div id="debugLog">Initializing...</div>
    </div>

    <footer class="controls-container">
        <form id="textForm" class="text-input-form">
            <input type="text" id="userInput" class="text-input" placeholder="Type a message or tap mic..." autocomplete="off">
            <button type="submit" class="send-btn">Send</button>
        </form>

        <div class="voice-controls">
            <button id="resetBtn" class="reset-btn">Reset</button>
            <button id="micBtn" class="mic-button">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const micBtn = document.getElementById('micBtn');
        const resetBtn = document.getElementById('resetBtn');
        const textForm = document.getElementById('textForm');
        const userInput = document.getElementById('userInput');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const chatBox = document.getElementById('chatBox');
        const debugLog = document.getElementById('debugLog');

        let isListening = false;
        let isProcessing = false;
        let conversationHistory = [];
        let recognition = null;
        let silenceTimer = null;
        let currentTranscript = "";
        const SILENCE_TIMEOUT_MS = 1200;
        const synth = window.speechSynthesis;

        function log(msg) {
            console.log(msg);
            debugLog.innerHTML += `<br>> ${msg}`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            log("CRITICAL ERROR: SpeechRecognition API not found in this browser.");
        } else {
            log("SpeechRecognition API detected.");
        }

        if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            log("WARNING: Insecure context (HTTP). Mic will be blocked by browser!");
        } else {
            log("Secure context confirmed (HTTPS or Localhost).");
        }

        textForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || isProcessing) return;
            userInput.value = '';
            stopAssistant();
            sendPromptToBackend(text);
        });

        function startListening() {
            if (!isListening) return;
            
            log("Initializing Speech Recognition...");
            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                log("Mic Active: Listening for speech...");
                setStatus('Listening', 'listening');
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                log("Heard: " + transcript);
                if (transcript.trim().length > 0) {
                    currentTranscript = transcript.trim();
                    clearTimeout(silenceTimer);
                    silenceTimer = setTimeout(() => {
                        processUserSpeech();
                    }, SILENCE_TIMEOUT_MS);
                }
            };

            recognition.onerror = (event) => {
                log("ERROR Event: " + event.error);
                if (event.error === 'not-allowed') {
                    alert("Permission denied! Enable mic access in your browser settings.");
                    stopAssistant();
                }
            };

            recognition.onend = () => {
                log("Speech recognition session ended.");
                if (isListening && !isProcessing) {
                    log("Restarting listener...");
                    setTimeout(startListening, 300);
                }
            };

            try {
                recognition.start();
            } catch(e) {
                log("Start exception: " + e.message);
            }
        }

        micBtn.addEventListener('click', () => {
            if (!SpeechRecognition) {
                alert("Speech recognition isn't supported.");
                return;
            }

            if (isListening) {
                log("User stopped assistant.");
                stopAssistant();
            } else {
                log("Mic button clicked. Starting assistant...");
                isListening = true;
                micBtn.classList.add('active');
                
                // Warm up audio synthesis engine
                if (synth) {
                    synth.cancel();
                    const u = new SpeechSynthesisUtterance('');
                    synth.speak(u);
                }

                startListening();
            }
        });

        async function processUserSpeech() {
            if (!currentTranscript || isProcessing) return;
            const text = currentTranscript;
            currentTranscript = "";
            
            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }
            
            await sendPromptToBackend(text);
        }

        async function sendPromptToBackend(userText) {
            isProcessing = true;
            renderMessage(userText, 'user');
            conversationHistory.push({ role: 'user', content: userText });
            setStatus('Thinking', 'thinking');
            log("Sending request to /api/chat...");

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                if (!response.ok) throw new Error(`HTTP error ${response.status}`);

                const data = await response.json();
                const aiReply = data.response;
                log("Backend responded successfully.");

                renderMessage(aiReply, 'ai');
                conversationHistory.push({ role: 'assistant', content: aiReply });

                if (isListening) {
                    speakOutput(aiReply);
                } else {
                    setStatus('Idle', '');
                    isProcessing = false;
                }

            } catch (err) {
                log("Fetch Error: " + err.message);
                renderMessage("Error connecting to server.", 'ai');
                setStatus('Idle', '');
                isProcessing = false;
            }
        }

        function speakOutput(text) {
            setStatus('Speaking', 'speaking');
            log("Speaking response...");
            if (synth) synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.05;

            const onFinish = () => {
                log("Finished speaking.");
                isProcessing = false;
                if (isListening) {
                    setTimeout(startListening, 300);
                } else {
                    setStatus('Idle', '');
                }
            };

            utterance.onend = onFinish;
            utterance.onerror = (e) => {
                log("TTS Error: " + e.error);
                onFinish();
            };

            if (synth) {
                synth.speak(utterance);
            } else {
                onFinish();
            }
        }

        function stopAssistant() {
            isListening = false;
            isProcessing = false;
            micBtn.classList.remove('active');
            clearTimeout(silenceTimer);
            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }
            if (synth) synth.cancel();
            setStatus('Idle', '');
            log("Assistant deactivated.");
        }

        resetBtn.addEventListener('click', () => {
            stopAssistant();
            conversationHistory = [];
            chatBox.innerHTML = '';
            log("Reset completed.");
        });

        function setStatus(text, statusClass) {
            statusText.innerText = text;
            statusBadge.className = 'status-badge ' + (statusClass || '');
        }

        function renderMessage(text, type) {
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${type}-bubble`;
            bubble.innerText = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
