<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Agent | FastAPI | Groq Cloud</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1120; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; padding: 20px; }
        .container { max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; height: 100%; background-color: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #334155; }
        .top-notice { padding: 12px 20px; color: #94a3b8; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; }
        .avatar-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0 10px 0; }
        .avatar-badge { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #10b981, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); margin-bottom: 8px; transition: all 0.3s ease; }
        .avatar-badge.listening { animation: pulse-green 1.5s infinite; background: linear-gradient(135deg, #10b981, #059669); }
        .avatar-badge.speaking { animation: pulse-blue 1.2s infinite; background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .status-text { color: #10b981; font-weight: 600; font-size: 1.1rem; height: 24px; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 18px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); } 70% { box-shadow: 0 0 0 18px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background-color: #0f172a; margin: 10px 20px; border-radius: 8px; border: 1px solid #1e293b; }
        .message-card { padding: 14px 18px; border-radius: 8px; line-height: 1.5; max-width: 90%; }
        .user-card { align-self: flex-start; background-color: #1e3a8a; border: 1px solid #2563eb; color: #eff6ff; width: 100%; }
        .ai-card { align-self: flex-start; background-color: #1e293b; border: 1px solid #334155; color: #f1f5f9; width: 100%; }
        .card-label { font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; color: #94a3b8; }
        .controls-panel { padding: 20px; display: flex; flex-direction: column; gap: 15px; background-color: #1e293b; }
        .button-group { display: flex; justify-content: center; gap: 15px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .btn-start { background-color: #22c55e; color: white; }
        .btn-start:hover { background-color: #16a34a; }
        .btn-end { background-color: #ef4444; color: white; }
        .btn-end:hover { background-color: #dc2626; }
        .btn-reset { background-color: #ffffff; color: #0f172a; }
        .btn-reset:hover { background-color: #e2e8f0; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .call-info { display: flex; flex-direction: column; align-items: flex-start; color: #94a3b8; font-size: 0.9rem; }
        .timer { font-family: monospace; font-size: 1rem; color: #f1f5f9; }
        .footer-tag { text-align: center; padding: 10px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-notice"><span>📌</span> Speak naturally after pressing <strong>Start Call</strong>.</div>
        <div class="avatar-area">
            <div id="avatar" class="avatar-badge">🤖</div>
            <div id="status" class="status-text">Ready</div>
        </div>
        <div id="chatBox" class="chat-box"></div>
        <div class="controls-panel">
            <div class="button-group">
                <button id="startBtn" class="btn btn-start">📞 Start Call</button>
                <button id="endBtn" class="btn btn-end" disabled>🚫 End Call</button>
                <button id="resetBtn" class="btn btn-reset">🔄 New Conversation</button>
            </div>
            <div class="call-info">
                <span>Call Duration</span>
                <span id="timer" class="timer">00:00:00</span>
            </div>
        </div>
        <div class="footer-tag">AI Voice Agent | FastAPI | Groq Cloud</div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusText = document.getElementById('status');
        const avatar = document.getElementById('avatar');
        const chatBox = document.getElementById('chatBox');
        const timerDisplay = document.getElementById('timer');

        let isCallActive = false;
        let conversationHistory = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let recognition = null;
        const synth = window.speechSynthesis;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = async (event) => {
                const userSpeech = event.results[0][0].transcript;
                if (!userSpeech.trim()) return;

                renderMessage('You:', userSpeech, 'user-card');
                conversationHistory.push({ role: 'user', content: userSpeech });
                setStatus('Thinking...', '');

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages: conversationHistory })
                    });

                    const data = await response.json();
                    const aiReply = data.response;
                    renderMessage('AI:', aiReply, 'ai-card');
                    conversationHistory.push({ role: 'assistant', content: aiReply });
                    speakResponse(aiReply);
                } catch (err) {
                    console.error('API Error:', err);
                    setStatus('Error connecting to AI backend', '');
                }
            };

            recognition.onerror = (event) => {
                console.warn('Speech recognition error:', event.error);
                if (isCallActive && event.error !== 'aborted') {
                    setTimeout(() => startListening(), 1000);
                }
            };
        } else {
            alert('Your browser does not support Speech Recognition. Please use Google Chrome.');
        }

        startBtn.addEventListener('click', () => {
            isCallActive = true;
            startBtn.disabled = true;
            endBtn.disabled = false;
            startTimer();
            startListening();
        });

        endBtn.addEventListener('click', () => {
            stopCall();
            setStatus('Call ended', '');
            renderNotice('Call ended');
        });

        resetBtn.addEventListener('click', () => {
            stopCall();
            conversationHistory = [];
            chatBox.innerHTML = '';
            setStatus('Ready', '');
            resetTimer();
        });

        function startListening() {
            if (!isCallActive) return;
            synth.cancel();
            setStatus('Listening...', 'listening');
            try { recognition.start(); } catch (e) { }
        }

        function speakResponse(text) {
            if (!isCallActive) return;
            setStatus('speaking...', 'speaking');
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.onend = () => { if (isCallActive) startListening(); };
            synth.speak(utterance);
        }

        function stopCall() {
            isCallActive = false;
            startBtn.disabled = false;
            endBtn.disabled = true;
            stopTimer();
            synth.cancel();
            if (recognition) recognition.stop();
            avatar.className = 'avatar-badge';
        }

        function setStatus(text, className) {
            statusText.innerText = text;
            avatar.className = 'avatar-badge ' + className;
        }

        function renderMessage(sender, text, cardType) {
            const card = document.createElement('div');
            card.className = `message-card ${cardType}`;
            card.innerHTML = `<div class="card-label">${sender}</div><div>${text}</div>`;
            chatBox.appendChild(card);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function renderNotice(text) {
            const notice = document.createElement('div');
            notice.style.color = '#94a3b8';
            notice.style.fontSize = '0.9rem';
            notice.style.textAlign = 'center';
            notice.style.margin = '10px 0';
            notice.innerText = text;
            chatBox.appendChild(notice);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startTimer() {
            resetTimer();
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
                const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function resetTimer() {
            stopTimer();
            secondsElapsed = 0;
            timerDisplay.innerText = '00:00:00';
        }
    </script>
</body>
</html>
