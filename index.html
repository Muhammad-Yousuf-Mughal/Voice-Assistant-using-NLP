<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aurora | AI Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #080511;
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 260px;
            background: rgba(14, 10, 23, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }

        .history-item {
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .history-item .delete-btn {
            opacity: 0;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
        }

        .history-item:hover .delete-btn { opacity: 1; }

        /* Main Content Layout */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
            position: relative;
            background: radial-gradient(circle at 50% 20%, #1a102f 0%, #080511 100%);
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .logo-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #c084fc, #a855f7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .brand-info { display: flex; flex-direction: column; }
        .brand-title { font-size: 1.05rem; font-weight: 600; color: #ffffff; }
        .brand-subtitle { font-size: 0.75rem; color: #9ca3af; }

        .status-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .status-dot { width: 7px; height: 7px; border-radius: 50%; background-color: #6b7280; transition: all 0.3s ease; }
        .status-badge.listening .status-dot { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-badge.thinking .status-dot { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .status-badge.speaking .status-dot { background-color: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

        .main-card {
            width: 100%;
            max-width: 820px;
            height: 52vh;
            background: rgba(18, 14, 29, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            margin: auto 0;
            overflow: hidden;
        }

        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .empty-state.hidden { opacity: 0; }
        .empty-title { font-size: 1.25rem; font-weight: 500; color: #e5e7eb; margin-bottom: 8px; }
        .empty-subtitle { font-size: 0.875rem; color: #6b7280; max-width: 320px; line-height: 1.4; }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-bubble {
            align-self: flex-end;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.25);
        }

        .ai-bubble {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            border-bottom-left-radius: 4px;
        }

        .controls-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: auto;
        }

        .activity-dots { display: flex; gap: 6px; height: 12px; align-items: center; }
        .dot { width: 5px; height: 5px; border-radius: 50%; background-color: #4b5563; transition: all 0.3s ease; }

        .listening .dot {
            background-color: #a855f7;
            animation: dotPulse 1.2s infinite ease-in-out alternate;
        }

        .listening .dot:nth-child(2) { animation-delay: 0.2s; }
        .listening .dot:nth-child(3) { animation-delay: 0.4s; }
        .listening .dot:nth-child(4) { animation-delay: 0.6s; }
        .listening .dot:nth-child(5) { animation-delay: 0.8s; }

        @keyframes dotPulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.6); opacity: 1; background-color: #38bdf8; }
        }

        .mic-button {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .mic-button:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(168, 85, 247, 0.5); }
        .mic-button:active { transform: scale(0.95); }
        .mic-button.active { animation: pulse-ring 2s infinite; background: linear-gradient(135deg, #ef4444 0%, #a855f7 100%); }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6); }
            70% { box-shadow: 0 0 0 22px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        .mic-icon { width: 28px; height: 28px; fill: currentColor; }

        .reset-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .reset-btn:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; border-color: rgba(255, 255, 255, 0.2); }

        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- ChatGPT Style Sidebar -->
    <aside id="sidebar" class="sidebar">
        <button id="newChatBtn" class="new-chat-btn">
            <span>+</span> New chat
        </button>
        <div id="historyList" class="history-list"></div>
    </aside>

    <!-- Main Content Container -->
    <div class="app-container">
        <header>
            <div class="brand-container">
                <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle Sidebar">☰</button>
                <div class="logo-avatar">A</div>
                <div class="brand-info">
                    <span class="brand-title">Aurora</span>
                    <span class="brand-subtitle">AI Voice Assistant</span>
                </div>
            </div>
            <div id="statusBadge" class="status-badge">
                <div class="status-dot"></div>
                <span id="statusText">Idle</span>
            </div>
        </header>

        <main class="main-card">
            <div id="emptyState" class="empty-state">
                <h2 class="empty-title">Say hello to Aurora</h2>
                <p class="empty-subtitle">Tap the mic below and start talking. Your conversation will appear here.</p>
            </div>
            <div id="chatBox" class="chat-box"></div>
        </main>

        <footer class="controls-container">
            <div id="activityDots" class="activity-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <button id="micBtn" class="mic-button" aria-label="Toggle Voice Assistant">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>

            <button id="resetBtn" class="reset-btn">Reset conversation</button>
        </footer>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const activityDots = document.getElementById('activityDots');
        const chatBox = document.getElementById('chatBox');
        const emptyState = document.getElementById('emptyState');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const newChatBtn = document.getElementById('newChatBtn');
        const historyList = document.getElementById('historyList');

        let isListening = false;
        let isProcessing = false;
        let currentSessionId = Date.now().toString();
        let conversationHistory = [];
        let allSessions = JSON.parse(localStorage.getItem('aurora_sessions') || '{}');

        let recognition = null;
        let silenceTimer = null;
        let currentTranscript = "";
        const SILENCE_TIMEOUT_MS = 800;
        const synth = window.speechSynthesis;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        // Initialize UI & Session Storage
        renderSidebar();

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            sidebar.classList.toggle('open');
        });

        newChatBtn.addEventListener('click', () => {
            createNewSession();
        });

        function saveSessionsToStorage() {
            localStorage.setItem('aurora_sessions', JSON.stringify(allSessions));
        }

        function createNewSession() {
            stopAssistant();
            currentSessionId = Date.now().toString();
            conversationHistory = [];
            chatBox.innerHTML = '';
            emptyState.classList.remove('hidden');
            setStatus('Idle', '');
            renderSidebar();
        }

        function loadSession(sessionId) {
            stopAssistant();
            currentSessionId = sessionId;
            conversationHistory = allSessions[sessionId]?.messages || [];
            chatBox.innerHTML = '';

            if (conversationHistory.length > 0) {
                emptyState.classList.add('hidden');
                conversationHistory.forEach(msg => {
                    renderMessageBubble(msg.content, msg.role === 'user' ? 'user' : 'ai');
                });
            } else {
                emptyState.classList.remove('hidden');
            }
            renderSidebar();
        }

        function deleteSession(sessionId, e) {
            e.stopPropagation();
            delete allSessions[sessionId];
            saveSessionsToStorage();
            if (currentSessionId === sessionId) {
                createNewSession();
            } else {
                renderSidebar();
            }
        }

        function renderSidebar() {
            historyList.innerHTML = '';
            Object.keys(allSessions).sort((a, b) => b - a).forEach(sessionId => {
                const session = allSessions[sessionId];
                if (!session.messages || session.messages.length === 0) return;

                const firstUserMsg = session.messages.find(m => m.role === 'user')?.content || 'New Conversation';
                const item = document.createElement('div');
                item.className = `history-item ${sessionId === currentSessionId ? 'active' : ''}`;
                item.innerText = firstUserMsg;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => deleteSession(sessionId, e);

                item.appendChild(delBtn);
                item.onclick = () => loadSession(sessionId);
                historyList.appendChild(item);
            });
        }

        async function initMicrophoneGain() {
            try {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                }
            } catch (err) {
                console.warn('Microphone permission notice:', err);
            }
        }

        function createFreshRecognition() {
            if (!SpeechRecognition) return null;

            if (recognition) {
                try { recognition.abort(); } catch(e){}
                recognition = null;
            }

            const instance = new SpeechRecognition();
            instance.continuous = false;
            instance.interimResults = true;
            instance.lang = 'en-US';

            instance.onresult = (event) => {
                if (!isListening || isProcessing) return;

                let transcript = '';
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                if (transcript.trim().length > 0) {
                    currentTranscript = transcript.trim();
                    clearTimeout(silenceTimer);
                    silenceTimer = setTimeout(() => {
                        processUserSpeech();
                    }, SILENCE_TIMEOUT_MS);
                }
            };

            instance.onerror = (event) => {
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    console.warn('Speech engine warning:', event.error);
                }
            };

            instance.onend = () => {
                if (isListening && !isProcessing && !synth.speaking) {
                    setTimeout(() => { if (isListening && !isProcessing) startListening(); }, 100);
                }
            };

            return instance;
        }

        async function processUserSpeech() {
            if (!currentTranscript || !isListening || isProcessing) return;

            isProcessing = true;
            clearTimeout(silenceTimer);

            const userText = currentTranscript;
            currentTranscript = "";

            if (recognition) {
                try { recognition.abort(); } catch (e) {}
            }

            renderMessageBubble(userText, 'user');
            conversationHistory.push({ role: 'user', content: userText });

            // Store session in localStorage
            allSessions[currentSessionId] = { messages: conversationHistory };
            saveSessionsToStorage();
            renderSidebar();

            setStatus('Thinking', 'thinking');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: conversationHistory })
                });

                const data = await response.json();
                const aiReply = data.response;

                renderMessageBubble(aiReply, 'ai');
                conversationHistory.push({ role: 'assistant', content: aiReply });

                allSessions[currentSessionId] = { messages: conversationHistory };
                saveSessionsToStorage();

                speakOutput(aiReply);

            } catch (err) {
                console.error('API Error:', err);
                setStatus('Error', '');
                isProcessing = false;
                setTimeout(() => { if (isListening) startListening(); }, 2000);
            }
        }

        micBtn.addEventListener('click', async () => {
            await initMicrophoneGain();

            if (!isListening) {
                isListening = true;
                micBtn.classList.add('active');
                startListening();
            } else {
                stopAssistant();
            }
        });

        resetBtn.addEventListener('click', () => {
            createNewSession();
        });

        function startListening() {
            if (!isListening || synth.speaking) return;
            currentTranscript = "";
            setStatus('Listening', 'listening');
            
            recognition = createFreshRecognition();
            if (recognition) {
                try { recognition.start(); } catch (e) {}
            }
        }

        function speakOutput(text) {
            if (!isListening) {
                isProcessing = false;
                return;
            }

            setStatus('Speaking', 'speaking');
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.05;
            utterance.pitch = 1.0;

            const handleSpeechEnd = () => {
                isProcessing = false;
                if (isListening) {
                    setTimeout(() => { startListening(); }, 200);
                }
            };

            utterance.onend = handleSpeechEnd;
            utterance.onerror = handleSpeechEnd;

            synth.speak(utterance);
        }

        function stopAssistant() {
            isListening = false;
            isProcessing = false;
            micBtn.classList.remove('active');
            clearTimeout(silenceTimer);
            synth.cancel();
            if (recognition) { 
                try { recognition.abort(); } catch (e) {} 
                recognition = null;
            }
            setStatus('Idle', '');
        }

        function setStatus(text, statusClass) {
            statusText.innerText = text;
            statusBadge.className = 'status-badge ' + statusClass;
            activityDots.className = 'activity-dots ' + statusClass;
        }

        function renderMessageBubble(text, type) {
            emptyState.classList.add('hidden');
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${type}-bubble`;
            bubble.innerText = text;
            chatBox.appendChild(bubble);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
